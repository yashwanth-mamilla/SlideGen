[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "slidegen"
version = "0.1.0"
description = "Download YouTube videos/playlists and extract presentation slides into image sequences and PDFs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "SlideGen Contributors" }
]
keywords = ["youtube", "slides", "presentation", "opencv", "yt-dlp", "pdf", "video-processing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]

dependencies = [
    "opencv-python>=4.5.0",
    "numpy>=1.20.0",
    "yt-dlp>=2023.1.1",
    "pillow>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
slidegen = "slidegen.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["slidegen*"]
